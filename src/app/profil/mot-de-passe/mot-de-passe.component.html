<form [formGroup]="motDePasseForm" (ngSubmit)="onSubmitForm()" id="formMotDePasse">
    <h1 class="h3 mb-3 fw-normal">{{ 'motDePasse.title' | translate }} ?</h1>
    <div class="mb-3">
        <label for="nouvMotDePasse" class="form-label">{{ 'motDePasse.legend' | translate }}</label>
        <input type="password" class="form-control" id="nouvMotDePasse" placeholder="{{ 'motDePasse.placeholder' | translate }}" formControlName="mdp">
    </div>
    <div style="padding-left:65px;padding-right:65px;margin-top:30px;">
        <button class="w-100 btn btn-lg btn-primary" type="submit" [disabled]="motDePasseForm.invalid">{{ 'motDePasse.confirm' | translate }}</button>
    </div>
</form>
<div id="backBar" (click)="retourProfilFct()">
    <h4>{{ 'motDePasse.backProfile' | translate }}</h4>
    <img src="../../assets/svg/arrow-left-square-fill-back-to-accueil.svg" alt="{{ 'motDePasse.backProfile' | translate }}"/>
</div>
