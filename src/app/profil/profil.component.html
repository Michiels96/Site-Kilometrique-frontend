<form [formGroup]="profilForm" (ngSubmit)="onSubmitForm()" id="formProfil">
    <h1 class="h3 mb-3 fw-normal">{{ 'profil.userTitle' | translate }} :</h1>

    <fieldset disabled>
        <div class="mb-3">
            <label for="id_utilisateur" class="form-label">Id</label>
            <input type="text" id="id_utilisateur" class="form-control" formControlName="id">
        </div>
    </fieldset>

    <div class="mb-3">
        <label for="email" class="form-label">{{ 'profil.userEmail' | translate }}</label>
        <input type="email" class="form-control" id="email" placeholder="albert@hotmail.com" formControlName="email">
    </div>

    <div class="mb-3" style="text-align: center;margin-top: 25px;">
        <button type="button" class="btn btn-secondary" (click)="modifierMdp()">{{ 'profil.userPassword' | translate }}</button>
    </div>

    <div class="mb-3">
        <label for="nom" class="form-label">{{ 'profil.userName' | translate }}</label>
        <input type="text" class="form-control" id="nom" placeholder="{{ 'profil.userName' | translate }}" formControlName="nom">
    </div>

    <div class="mb-3">
        <label for="prenom" class="form-label">{{ 'profil.userLastname' | translate }}</label>
        <input type="text" class="form-control" id="prenom" placeholder="{{ 'profil.userLastname' | translate }}" formControlName="prenom">
    </div>

    <div class="mb-3">
        <label for="date_naissance" class="form-label">{{ 'profil.userBirthdate' | translate }}</label>
        <input type="date" class="form-control" id="date_naissance" formControlName="date_naissance">
    </div>

    <div class="mb-3" *ngIf="modifierUtilisateur">
        <label for="nbKilometresCumules" class="form-label">{{ 'profil.userTotalKms' | translate }}</label>
        <input type="number" class="form-control" id="nbKilometresCumules" placeholder="{{ 'profil.userTotalKms' | translate }}" formControlName="nbKilometresCumules">
    </div>

    <div class="form-check form-switch noselect" *ngIf="modifierUtilisateur">
        <input class="form-check-input" type="checkbox" id="estConnecte" formControlName="estConnecte">
        <label class="form-check-label" for="estConnecte">{{ 'profil.userConnectionStatus' | translate }}</label>
    </div>

    <div class="form-check form-switch noselect" *ngIf="modifierUtilisateur" style="margin-bottom: 20px;">
        <input class="form-check-input" type="checkbox" id="estAdmin" formControlName="estAdmin">
        <label class="form-check-label" for="estAdmin">{{ 'profil.userAdminStatus' | translate }}</label>
    </div>
    <div style="padding-left:65px;padding-right:65px;margin-top:30px;">
        <button class="w-100 btn btn-lg btn-primary" type="submit" [disabled]="profilForm.invalid">{{ 'profil.userModify' | translate }}</button>
    </div>
</form>

<div *ngIf="!modifierUtilisateur" id="backBar" routerLink="/">
    <h4>{{ 'profil.userBackHome' | translate }}</h4>
    <img src="../../assets/svg/arrow-left-square-fill-back-to-accueil.svg" alt="Retour à l'accueil"/>
</div>

<div *ngIf="modifierUtilisateur" id="backBar" routerLink="/utilisateurs">
    <h4>{{ 'profil.userBackUsers' | translate }}</h4>
    <img src="../../assets/svg/arrow-left-square-fill-back-to-accueil.svg" alt="Retour à la liste des utilisateurs"/>
</div>
