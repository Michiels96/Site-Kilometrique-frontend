<form [formGroup]="vehiculeForm" (ngSubmit)="onSubmitForm()" id="formModifierVehicule">
    <h1 class="h3 mb-3 fw-normal" *ngIf="vehiculeAModifier != null">{{ 'modifierVehicule.title' | translate }} <span style="font-style: italic;">{{vehiculeAModifier['nom_unique']}}</span> :</h1>
    <fieldset disabled *ngIf="vehiculeAModifier != null">
        <div class="mb-3">
            <label for="id_vehicule" class="form-label">Id</label>
            <input type="text" id="id_vehicule" class="form-control" formControlName="id">
        </div>
    </fieldset>

    <div class="mb-3">
        <label for="nom" class="form-label">{{ 'modifierVehicule.name' | translate }}</label>
        <input type="text" class="form-control" id="nom" placeholder="{{ 'modifierVehicule.name' | translate }}" formControlName="nom">
    </div>

    <div class="mb-3">
        <label for="marque" class="form-label">{{ 'modifierVehicule.brand' | translate }}</label>
        <select id="marque" class="form-select" aria-label="Default select example" formControlName="marque" style="margin-bottom: 15px;">
            <option value="" disabled [selected]="idUtilisateurNouveauVehicule != -1" *ngIf="idUtilisateurNouveauVehicule != -1">{{ 'modifierVehicule.brandChoice' | translate }}</option>
            <option *ngFor="let marque of marques" value="{{marque['nom_unique']}}">{{marque['nom_unique']}}</option>
        </select>
    </div>
    
    <div class="mb-3">
        <label for="type" class="form-label">{{ 'modifierVehicule.type' | translate }}</label>
        <select id="type" class="form-select" aria-label="Default select example" formControlName="type" style="margin-bottom: 15px;">
            <option value="" disabled [selected]="idUtilisateurNouveauVehicule != -1" *ngIf="idUtilisateurNouveauVehicule != -1">{{ 'modifierVehicule.typeChoice' | translate }}</option>
            <option *ngFor="let type of types" value="{{type}}">{{type}}</option>
        </select>
    </div>

    <div class="form-floating">
        <textarea class="form-control" placeholder="Laissez un commentaire" id="detail" style="height: 100px; margin-bottom: 20px;" formControlName="detail"></textarea>
        <label for="detail">{{ 'modifierVehicule.details' | translate }}</label>
    </div>
    <div style="padding-left:65px;padding-right:65px;margin-top:30px;">
        <button class="w-100 btn btn-lg btn-primary" type="submit" [disabled]="vehiculeForm.invalid"><span *ngIf="vehiculeAModifier != null">{{ 'modifierVehicule.submit' | translate }}</span><span *ngIf="vehiculeAModifier == null">{{ 'modifierVehicule.createSubmit' | translate }}</span></button>
    </div>
</form>

<div id="backBar" routerLink="/vehicules" (click)="resetVehiculeSelectionnee()">
    <h4>{{ 'modifierVehicule.backHome' | translate }}</h4>
    <img src="../../assets/svg/arrow-left-square-fill-back-to-accueil.svg" alt="{{ 'modifierVehicule.backHome' | translate }}"/>
</div>
